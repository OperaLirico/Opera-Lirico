services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: operalab-changedetection
    hostname: operalab-changedetection
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TZ: Europe/Rome
      LLM_FEATURES_DISABLED: "true"
      DISABLE_VERSION_CHECK: "true"
      FETCH_WORKERS: "2"
    volumes:
      - changedetection-data:/datastore
    restart: unless-stopped

volumes:
  changedetection-data:
