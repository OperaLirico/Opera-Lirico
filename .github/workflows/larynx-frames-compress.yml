name: Larynx frames compress

on:
  push:
    paths:
      - content/larynx-frames-compress.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Convert the frames to 1200px JPEG
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for n in pca lca ia ta ct; do
            convert "assets/anatomy/glottis-$n.png" -resize 1200x800^ -gravity center -extent 1200x800 -strip -quality 78 "assets/anatomy/glottis-$n.jpg"
          done
          ls -lh assets/anatomy/glottis-*.jpg
          for n in pca lca ia ta ct; do rm -f "assets/anatomy/glottis-$n.png"; done
          du -sh assets/anatomy

      - name: Point the page at the JPEGs
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'glottis-pca.jpg' in t:
              print('already jpg')
              raise SystemExit(0)
          for n in ('pca', 'lca', 'ia', 'ta', 'ct'):
              old = 'assets/anatomy/glottis-%s.png' % n
              c = t.count(old)
              if c != 1:
                  sys.exit('ABORT: %s -> %d' % (old, c))
              t = t.replace(old, 'assets/anatomy/glottis-%s.jpg' % n, 1)
          if '.png' in t and 'glottis' in t:
              sys.exit('ABORT: a glottis png reference is still present')
          p.write_text(t, encoding='utf-8')
          print('jpgs wired,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "perf(anatomy): compress the glottis frames to 1200px jpg"
            git push
          fi
