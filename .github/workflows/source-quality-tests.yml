name: Source quality tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scrape_sources.py"
      - "grow_sources.py"
      - "tests/**"
      - "data/opportunity.schema.json"
      - ".github/workflows/source-quality-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON data contract
        run: python -m json.tool data/opportunity.schema.json > /dev/null
