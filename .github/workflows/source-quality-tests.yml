name: Source quality tests

on:
  push:
    branches: ["quality/**"]
    paths:
      - "app.js"
      - "data/opportunities.json"
      - "data/conservatori_manual.json"
      - "data/conservatori.json"
      - "scrape_sources.py"
      - "grow_sources.py"
      - "audit_source_coverage.py"
      - "audit_opportunity_quality.py"
      - "audit_pdf_integrity.py"
      - "audit_extraction_pilot.py"
      - "discover_masterclasses.py"
      - "data/masterclass_sources.json"
      - ".github/workflows/weekly-source-coverage.yml"
      - "tests/**"
      - "data/opportunity.schema.json"
      - "data/source_fetch_policies.json"
      - ".github/workflows/source-quality-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "discover_masterclasses.py"
      - "data/masterclass_sources.json"
      - "data/masterclasses.json"
      - "data/masterclass.schema.json"
      - "app.js"
      - "data/opportunities.json"
      - "data/conservatori_manual.json"
      - "data/conservatori.json"
      - "scrape_sources.py"
      - "grow_sources.py"
      - "audit_source_coverage.py"
      - "audit_opportunity_quality.py"
      - "audit_pdf_integrity.py"
      - "audit_extraction_pilot.py"
      - ".github/workflows/weekly-source-coverage.yml"
      - "tests/**"
      - "data/opportunity.schema.json"
      - "data/source_fetch_policies.json"
      - ".github/workflows/source-quality-tests.yml"
      - ".github/workflows/p2-p4-extraction-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test read-only audit reports
        run: |
          python audit_opportunity_quality.py
          python audit_pdf_integrity.py
      - name: Validate pilot script syntax
        run: python -m py_compile audit_extraction_pilot.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate JSON data contract
        run: |
          python -m json.tool data/opportunity.schema.json > /dev/null
          python -m json.tool data/opportunities.json > /dev/null
