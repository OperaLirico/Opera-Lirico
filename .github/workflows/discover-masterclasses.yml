name: Discover masterclasses

on:
  pull_request:
    paths:
      - "discover_masterclasses.py"
      - "data/masterclass_sources.json"
      - "tests/test_masterclass_discovery.py"
      - ".github/workflows/discover-masterclasses.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterclass-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run discovery tests
        run: python -m unittest tests.test_masterclass_discovery -v
      - name: Discover masterclass leads
        run: python discover_masterclasses.py
      - name: Save review queue
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/masterclass_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh masterclass discovery queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
