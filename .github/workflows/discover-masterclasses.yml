name: Discover masterclasses

on:
  push:
    branches: [main]
    paths:
      - "discover_masterclasses.py"
      - "data/masterclass_sources.json"
      - ".github/workflows/discover-masterclasses.yml"
      - "requirements.txt"
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterclass-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run discovery tests
        run: python -m unittest tests.test_masterclass_discovery -v
      - name: Discover masterclass leads
        if: github.event_name != 'pull_request'
        run: python discover_masterclasses.py
      - name: Summarize discovery results
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("data/masterclass_candidates.json").read_text(encoding="utf-8"))
          errors = data.get("fetch_errors", [])
          lines = [
              "## Masterclass discovery",
              f"- Sources checked: {data.get('source_count', 0)}",
              f"- Current candidate queue: {data.get('candidate_count', 0)}",
              f"- New or refreshed this run: {data.get('new_or_refreshed_this_run', 0)}",
              f"- Source fetch errors: {len(errors)}",
              f"- Updated at: {data.get('updated_at', 'unknown')}",
          ]
          if errors:
              lines.append("### Sources needing attention")
              for error in errors[:20]:
                  lines.append(f"- {error.get('source', 'unknown')}: {error.get('status') or error.get('http_status') or error.get('error') or 'fetch error'}")
          summary = chr(10).join(lines) + chr(10)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          if errors:
              print(f"::warning::{len(errors)} masterclass source fetch error(s); see the step summary.")
          PY
      - name: Save review queue
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/masterclass_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh masterclass discovery queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
