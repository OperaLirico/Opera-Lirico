name: Workflow failure alert

on:
  workflow_run:
    workflows:
      - "Check website copy changes"
      - "Daily source refresh"
      - "Deploy private operations dashboard"
      - "Discover masterclasses"
      - "Isolated Docling PDF pilot"
      - "Generate social content drafts"
      - "P2 P4 extraction pilot"
      - "Deploy GitHub Pages"
      - "PDF signature evidence audit"
      - "Source quality tests"
      - "Weekly email digest (draft only)"
      - "Weekly source coverage"
      - "Weekly source discovery"
    types: [completed]

permissions:
  actions: read
  issues: write

concurrency:
  group: workflow-failure-alert-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the automation failure log
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const failedJobs = data.jobs.filter(job => job.conclusion === "failure");
            const jobLines = failedJobs.length
              ? failedJobs.map(job => `- [${job.name}](${job.html_url})`).join("\n")
              : "- GitHub reported a workflow-level failure; no failed job details were returned.";
            const body = [
              "@wl19971007-lgtm",
              "",
              "### Workflow failure detected",
              `- Workflow: **${run.name}**`,
              `- Run: [#${run.run_number}](${run.html_url})`,
              `- Branch: ${run.head_branch || "unknown"}`,
              `- Event: ${run.event}`,
              `- Commit: ${run.head_sha}`,
              `- Started: ${run.run_started_at || run.created_at}`,
              "",
              "### Failed jobs",
              jobLines,
              "",
              "This issue is an alert log only. Review the linked run before changing production data or rerunning the workflow."
            ].join("\n");
            const title = "Opera Lirico — automation failure log";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Added failure alert to issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure alert issue #${issue.number}`);
            }
