name: Workflow failure digest

# Replaces the previous per-run alert, which started once for every completion of
# eight workflows and produced mostly empty runs.
# Now it runs once a day and stays silent unless something actually failed.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: opera-lirico-failure-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize failures from the last 24 hours
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              created: `>=${since}`,
              per_page: 100
            });
            const runs = data.workflow_runs || [];
            const failed = runs.filter(run => run.conclusion === "failure");
            core.info(`Runs in the last 24h: ${runs.length}. Failures: ${failed.length}.`);

            // Silent when everything is green: no issue, no comment, no notification.
            if (failed.length === 0) {
              core.info("No failures in the last 24 hours; nothing to report.");
              return;
            }

            const MAX_DETAIL = 10;
            const lines = [];
            for (const run of failed.slice(0, MAX_DETAIL)) {
              let stepLine = "";
              try {
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100
                });
                // Report step names only. Never copy raw job logs into an issue: logs may contain secrets.
                const failedSteps = (jobs.data.jobs || [])
                  .filter(job => job.conclusion === "failure")
                  .flatMap(job => (job.steps || [])
                    .filter(step => step.conclusion === "failure")
                    .map(step => String(step.name || "Unnamed step").replace(/[\r\n`]/g, " ").slice(0, 120)));
                if (failedSteps.length) {
                  stepLine = `\n  - Failed step(s): ${failedSteps.map(name => `\`${name}\``).join(", ")}`;
                }
              } catch (error) {
                stepLine = "";
              }
              lines.push(`- **${run.name}** \u00b7 [#${run.run_number}](${run.html_url}) \u00b7 \`${run.head_branch || "unknown"}\` \u00b7 ${run.event}${stepLine}`);
            }

            const title = "Opera Lirico \u2014 automation failure log";
            const body = [
              "",
              `### Daily failure digest (${new Date().toISOString().slice(0, 10)})`,
              `- Failures in the last 24 hours: **${failed.length}** of ${runs.length} runs`,
              failed.length > MAX_DETAIL ? `- Showing the most recent ${MAX_DETAIL}; open the Actions tab for the rest` : "",
              "",
              lines.join("\n"),
              "",
              "This issue is an alert log only. Review the linked run before changing production data or rerunning the workflow."
            ].filter(Boolean).join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Added daily digest to issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure log issue #${issue.number}`);
            }
