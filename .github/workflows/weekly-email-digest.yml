name: Weekly email digest (draft only)

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-email-digest
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run digest tests
        run: |
          python -m py_compile weekly_digest.py
          python -m unittest discover -s tests -p 'test_weekly_digest.py' -v
      - name: Generate local preview and optional private draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python weekly_digest.py
      - name: Upload private preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-lirico-weekly-draft-${{ github.run_id }}
          path: build/email-draft/
          retention-days: 14
      - name: Summarize draft-only result
        run: |
          {
            echo "## Opera Lirico weekly email"
            echo "- Mode: DRAFT ONLY"
            echo "- No send endpoint is called by this workflow."
            echo "- Preview artifact retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
