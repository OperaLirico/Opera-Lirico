name: Larynx map v7 mucosa

on:
  push:
    paths:
      - content/larynx-map-v7.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repaint v7 — mucosa palette, merged mounds, no hard cartilage outlines
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="7"' in t:
              print('already v7')
              raise SystemExit(0)

          def swap(old, new, label):
              global t
              if t.count(old) != 1:
                  sys.exit('ABORT: %s -> %d matches' % (label, t.count(old)))
              t = t.replace(old, new, 1)

          swap('data-version="6"', 'data-version="7"', 'version')

          # 背景：暖纸面改成喉镜下那種湿润的黏膜底色
          swap('''<stop offset="0" stop-color="#fbf3ee"/>
                  <stop offset="1" stop-color="#ece0d7"/>''',
               '''<stop offset="0" stop-color="#f7efe9"/>
                  <stop offset="1" stop-color="#e4d2c9"/>''', 'bg')

          swap('''<stop offset="0" stop-color="#3d4e48"/>
                  <stop offset="0.55" stop-color="#23312d"/>
                  <stop offset="1" stop-color="#151f1c"/>''',
               '''<stop offset="0" stop-color="#33302f"/>
                  <stop offset="0.55" stop-color="#1a1e1f"/>
                  <stop offset="1" stop-color="#0d1011"/>''', 'air')

          # 声带：从红棕改成黏膜暖粉
          for side in ('foldLGrad', 'foldRGrad'):
              old = '''<linearGradient id="%s" x1="1" y1="0" x2="0" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>''' % side
              alt = '''<linearGradient id="%s" x1="0" y1="0" x2="1" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>''' % side
              for src in (old, alt):
                  if t.count(src) == 1:
                      t = t.replace(src, '''<linearGradient id="%s" x1="1" y1="0" x2="0" y2="0.2">
                  <stop offset="0" stop-color="#ad6a5c"/>
                  <stop offset="0.3" stop-color="#d29486"/>
                  <stop offset="0.7" stop-color="#eab9ac"/>
                  <stop offset="1" stop-color="#f9e2d8"/>''' % side, 1)
                      break
              else:
                  sys.exit('ABORT: fold gradient %s not found' % side)

          # 软骨渐变 → 黏膜隆起（被黏膜覆盖的软骨）
          swap('''<radialGradient id="cartGrad" cx="0.4" cy="0.34" r="0.75">
                  <stop offset="0" stop-color="#fdfaf2"/>
                  <stop offset="0.55" stop-color="#eee6d4"/>
                  <stop offset="1" stop-color="#d5c8ae"/>''',
               '''<radialGradient id="cartGrad" cx="0.42" cy="0.3" r="0.8">
                  <stop offset="0" stop-color="#f7d3c8"/>
                  <stop offset="0.55" stop-color="#e2a89b"/>
                  <stop offset="1" stop-color="#c7857a"/>''', 'cart gradient')

          # 环状软骨后板：改成后方黏膜桥，不再像一块饼干
          swap('<path d="M300 348 Q380 394 460 348 L474 376 Q380 422 286 376 Z" fill="url(#cartGrad)" stroke="#c6bba2" stroke-width="1.4"/>',
               '<path d="M300 348 Q380 394 460 348 L474 376 Q380 422 286 376 Z" fill="url(#cartGrad)" stroke="#b8837a" stroke-width="1"/>', 'posterior bridge')

          # 两侧软骨的硬描边改成软膜边
          for old_stroke in ('stroke="#b9ad95" stroke-width="1.6"', 'stroke="#b9ad95" stroke-width="1.3"', 'stroke="#c0b49d" stroke-width="1.2"'):
              n = t.count(old_stroke)
              if n < 1:
                  sys.exit('ABORT: stroke %s not found' % old_stroke)
              t = t.replace(old_stroke, old_stroke.replace('#b9ad95', '#b9837a').replace('#c0b49d', '#bf8b81'), n)

          swap('fill="#f3ecdb" stroke="#b9837a"', 'fill="#efc7bc" stroke="#b9837a"', 'vocal process L')
          swap('fill="#f3ecdb" stroke="#b9837a"', 'fill="#efc7bc" stroke="#b9837a"', 'vocal process R')
          swap('fill="#eae1cd" stroke="#b9837a"', 'fill="#e6b3a7" stroke="#b9837a"', 'muscular L')
          swap('fill="#eae1cd" stroke="#b9837a"', 'fill="#e6b3a7" stroke="#b9837a"', 'muscular R')
          swap('fill="#f8f2e4" stroke="#bf8b81"', 'fill="#f5d9cf" stroke="#bf8b81"', 'corniculate L')
          swap('fill="#f8f2e4" stroke="#bf8b81"', 'fill="#f5d9cf" stroke="#bf8b81"', 'corniculate R')

          for token in ('data-version="7"', '#f7d3c8', '#ad6a5c', '#efc7bc'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)

          p.write_text(t, encoding='utf-8')
          print('v7 written,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "feat(anatomy): v7 — endoscopic mucosa palette, soft tissue edges"
            git push
          fi
