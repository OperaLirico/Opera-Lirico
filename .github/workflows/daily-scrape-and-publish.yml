name: Daily source refresh
on:
  push:
    branches: [main]
    paths:
      - "data/sources.json"
      - "scrape_sources.py"
      - "grow_sources.py"
      - "run_conservatori.py"
      - "mirror_pdfs.py"
      - "audit_opportunity_quality.py"
      - "audit_pdf_integrity.py"
      - "requirements.txt"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-source-refresh
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Scrape public source pages
        run: python scrape_sources.py
      - name: Refresh discovered audition sources
        run: python grow_sources.py
      - name: Scrape conservatory admission pages
        run: python run_conservatori.py
      - name: Mirror the official bando PDFs into the site
        run: python mirror_pdfs.py
      - name: Audit mirrored PDF byte integrity
        run: python audit_pdf_integrity.py
      - name: Generate daily opportunity quality report
        run: python audit_opportunity_quality.py
      - name: Save refreshed source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json data/sources_extra.json data/source_fetch_policies.json data/conservatori.json
          git add data/pdfs 2>/dev/null || true
          git add .github/audits/opportunity-quality-latest.json .github/audits/opportunity-quality-latest.md .github/audits/pdf-integrity-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official source snapshots and quality audits'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
