name: Daily scrape and publish

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "extra.css"
      - "icon.svg"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "data/**"
      - "!data/repertoire_archive.json"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/daily-scrape-and-publish.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Scrapling
        run: python -m pip install -r requirements.txt
      - name: Scrape public source pages
        run: python scrape_sources.py
      - name: Refresh discovered audition sources
        run: python grow_sources.py
      - name: Scrape conservatory admission pages
        run: python run_conservatori.py
      - name: Mirror the official bando PDFs into the site
        run: python mirror_pdfs.py
      - name: Save refreshed source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json data/sources_extra.json data/conservatori.json
          git add data/pdfs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official opportunity snapshots'
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
