name: Daily scrape and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - data/repertoire.json
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Scrapling
        run: python -m pip install -r requirements.txt
      - name: Scrape public source pages
        run: python scrape_sources.py
      - name: Scrape conservatory admission pages
        run: python run_conservatori.py
      - name: Save expanded song catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Start with the latest published catalogue and its scan cursor.
          git fetch origin main
          git checkout origin/main -- data/repertoire.json
          python prune_repertoire.py
          python update_repertoire.py
          git add data/repertoire.json data/conservatori.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update song catalogue and conservatory snapshot'
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
