name: Daily source refresh
on:
  push:
    branches: [main]
    paths:
      - "data/sources.json"
      - "scrape_sources.py"
      - "grow_sources.py"
      - "run_conservatori.py"
      - "mirror_pdfs.py"
      - "audit_opportunity_quality.py"
      - "audit_pdf_integrity.py"
      - "collect_repertoire_candidates.py"
      - "requirements.txt"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-source-refresh
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Scrape public source pages
        run: python scrape_sources.py
      - name: Refresh discovered audition sources
        run: python grow_sources.py
      - name: Scrape conservatory admission pages
        run: python run_conservatori.py
      - name: Mirror the official bando PDFs into the site
        run: python mirror_pdfs.py
      - name: Audit mirrored PDF byte integrity
        run: python audit_pdf_integrity.py
      - name: Generate daily opportunity quality report
        run: python audit_opportunity_quality.py
      - name: Save refreshed source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json data/sources_extra.json data/source_fetch_policies.json data/conservatori.json
          git add data/pdfs 2>/dev/null || true
          git add .github/audits/opportunity-quality-latest.json .github/audits/opportunity-quality-latest.md .github/audits/pdf-integrity-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official source snapshots and quality audits'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

  repertoire-collection:
    name: Collect repertoire review candidates
    permissions:
      contents: write
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repertoire collection tests
        run: python -m unittest tests.test_repertoire_candidates -v
      - name: Collect the next batch of opera-libretto candidates
        run: python collect_repertoire_candidates.py
      - name: Save candidate queue (not public catalogue)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repertoire_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Collect daily opera repertoire review candidates'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No new repertoire candidates."
          fi

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
