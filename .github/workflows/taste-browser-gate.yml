name: Taste browser gate

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "masterclasses.html"
      - "voice-anatomy.html"
      - "larynx-mechanism.html"
      - "voice-lab.html"
      - "taste-home.css"
      - "taste-interior.css"
      - "taste-home.js"
      - "styles.css"
      - "skills/taste-skill/**"
      - ".github/workflows/taste-browser-gate.yml"

permissions:
  contents: read

jobs:
  taste-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install Chromium for the upstream Taste checkers
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x -print -quit)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Could not locate the installed Chromium executable."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Sync the pinned upstream Taste Skill
        run: bash skills/taste-skill/sync.sh

      - name: Run the full Taste finish gate on every redesigned page
        shell: bash
        run: |
          set -uo pipefail
          SKILL="skills/taste-skill/upstream/skills/taste-skill"
          FAILED=0
          while IFS='|' read -r PAGE CATEGORY PRIMARY; do
            echo "::group::Taste gate — $PAGE"
            node "$SKILL/scripts/gate.mjs" --start "$PAGE" --root . --kind software --category "$CATEGORY" --primary "$PRIMARY" --rounds 1 --new
            START_CODE=$?
            if [ "$START_CODE" -ne 0 ]; then
              echo "Could not arm Taste gate for $PAGE (exit $START_CODE)."
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            node "$SKILL/scripts/gate.mjs" "$PAGE" --root . --kind software --category "$CATEGORY" --primary "$PRIMARY"
            GATE_CODE=$?
            if [ "$GATE_CODE" -ne 0 ]; then
              echo "Taste gate failed for $PAGE (exit $GATE_CODE)."
              FAILED=1
            fi
            echo "::endgroup::"
          done <<'PAGES'
          index.html|European vocal opportunities and application information for Chinese singers|Explore verified opportunities
          masterclasses.html|European vocal masterclasses and advanced study for Chinese singers|View verified masterclasses
          voice-anatomy.html|Anatomy and vocal production learning resources for classical singers|Explore vocal anatomy
          larynx-mechanism.html|Laryngeal anatomy and phonation learning resources for classical singers|Explore laryngeal mechanisms
          voice-lab.html|Interactive vocal science and anatomy learning resources for classical singers|Explore vocal structures
          PAGES
          exit "$FAILED"
