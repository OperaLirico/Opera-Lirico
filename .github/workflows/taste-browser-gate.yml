name: Responsive browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "masterclasses.html"
      - "voice-anatomy.html"
      - "larynx-mechanism.html"
      - "voice-lab.html"
      - "taste-home.css"
      - "taste-interior.css"
      - "taste-home.js"
      - "styles.css"
      - "assets/motion/**"
      - "assets/moments/**"
      - "assets/taste-polish.css"
      - "scripts/responsive-smoke.mjs"
      - ".github/workflows/taste-browser-gate.yml"

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/operalab-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/operalab-http.log
          exit 1

      - name: Check responsive layouts and key interactions
        run: node scripts/responsive-smoke.mjs http://127.0.0.1:4173
