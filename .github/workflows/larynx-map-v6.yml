name: Larynx map v6

on:
  push:
    paths:
      - content/larynx-map-v6.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Repaint v6 — arytenoids joined to the folds, soft posterior glottis
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="6"' in t:
              print('already v6')
              raise SystemExit(0)

          new_svg = '''<svg id="mechMap" data-version="6" viewBox="0 0 760 460" data-state="pca" role="img" aria-labelledby="mechMapTitle mechMapDesc">
              <title id="mechMapTitle">声门形态随喉内肌机制变化的示意图</title>
              <desc id="mechMapDesc">上方为前联合，下方为两侧杓状软骨的声门示意图。选择机制时声带与杓状软骨绕前联合转动，箭头标出运动方向；为示意性质，不是真实组织形变。</desc>
              <defs>
                <radialGradient id="bgGrad" cx="380" cy="240" r="330" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#fbf3ee"/>
                  <stop offset="1" stop-color="#ece0d7"/>
                </radialGradient>
                <radialGradient id="airGrad" cx="380" cy="250" r="160" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#3d4e48"/>
                  <stop offset="0.55" stop-color="#23312d"/>
                  <stop offset="1" stop-color="#151f1c"/>
                </radialGradient>
                <linearGradient id="foldLGrad" x1="1" y1="0" x2="0" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>
                </linearGradient>
                <linearGradient id="foldRGrad" x1="0" y1="0" x2="1" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>
                </linearGradient>
                <radialGradient id="cartGrad" cx="0.4" cy="0.34" r="0.75">
                  <stop offset="0" stop-color="#fdfaf2"/>
                  <stop offset="0.55" stop-color="#eee6d4"/>
                  <stop offset="1" stop-color="#d5c8ae"/>
                </radialGradient>
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8a6a5c" flood-opacity="0.22"/>
                </filter>
                <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5f4238" flood-opacity="0.28"/>
                </filter>
                <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0 0 L10 5 L0 10 z" fill="#b07a5f"/>
                </marker>
              </defs>
              <rect x="0" y="0" width="760" height="460" fill="url(#bgGrad)"/>
              <path d="M300 348 Q380 394 460 348 L474 376 Q380 422 286 376 Z" fill="url(#cartGrad)" stroke="#c6bba2" stroke-width="1.4"/>
              <path d="M380 84 C366 158 356 236 352 316 L408 316 C404 236 394 158 380 84 Z" fill="url(#airGrad)"/>
              <g id="sideLeft" class="side">
                <g filter="url(#foldShadow)">
                  <path d="M380 80 C362 160 350 230 346 286" stroke="url(#foldLGrad)" stroke-width="23" stroke-linecap="round" fill="none"/>
                </g>
                <path d="M379 92 C364 164 355 230 351 280" stroke="#fff4ec" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
                <g id="aryLeft" class="ary" filter="url(#softShadow)">
                  <path d="M328 272 C306 270 292 288 294 310 C296 332 316 344 336 336 C358 328 364 306 354 288 C346 274 338 272 328 272 Z" fill="url(#cartGrad)" stroke="#b9ad95" stroke-width="1.6"/>
                  <path d="M326 272 L354 262 L336 290 Z" fill="#f3ecdb" stroke="#b9ad95" stroke-width="1.3"/>
                  <path d="M298 308 L280 316 L298 326 Z" fill="#eae1cd" stroke="#b9ad95" stroke-width="1.3"/>
                  <circle cx="324" cy="272" r="6.5" fill="#f8f2e4" stroke="#c0b49d" stroke-width="1.2"/>
                  <ellipse cx="322" cy="300" rx="15" ry="11" fill="#ffffff" opacity="0.3"/>
                  <circle cx="284" cy="316" r="3.4" fill="#a35f4c"/>
                </g>
              </g>
              <g id="sideRight" class="side">
                <g filter="url(#foldShadow)">
                  <path d="M380 80 C398 160 410 230 414 286" stroke="url(#foldRGrad)" stroke-width="23" stroke-linecap="round" fill="none"/>
                </g>
                <path d="M381 92 C396 164 405 230 409 280" stroke="#fff4ec" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
                <g id="aryRight" class="ary" filter="url(#softShadow)">
                  <path d="M432 272 C454 270 468 288 466 310 C464 332 444 344 424 336 C402 328 396 306 406 288 C414 274 422 272 432 272 Z" fill="url(#cartGrad)" stroke="#b9ad95" stroke-width="1.6"/>
                  <path d="M434 272 L406 262 L424 290 Z" fill="#f3ecdb" stroke="#b9ad95" stroke-width="1.3"/>
                  <path d="M462 308 L480 316 L462 326 Z" fill="#eae1cd" stroke="#b9ad95" stroke-width="1.3"/>
                  <circle cx="436" cy="272" r="6.5" fill="#f8f2e4" stroke="#c0b49d" stroke-width="1.2"/>
                  <ellipse cx="438" cy="300" rx="15" ry="11" fill="#ffffff" opacity="0.3"/>
                  <circle cx="476" cy="316" r="3.4" fill="#a35f4c"/>
                </g>
              </g>
              <g id="arrowsOpen" class="arrow-g">
                <path d="M338 236 L288 226" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M422 236 L472 226" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsClose" class="arrow-g">
                <path d="M290 240 L336 248" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M470 240 L424 248" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsMid" class="arrow-g">
                <path d="M300 300 L348 300" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M460 300 L412 300" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsThick" class="arrow-g">
                <path d="M336 186 L298 186" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M424 186 L462 186" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsLong" class="arrow-g">
                <path d="M380 146 L380 236" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g font-family="system-ui,sans-serif" font-size="13" fill="#5b6860">
                <text x="380" y="44" text-anchor="middle">前联合</text>
                <text x="190" y="232" text-anchor="end">声带</text>
                <path d="M194 228 L318 234" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="184" y="352" text-anchor="end">杓状软骨</text>
                <path d="M188 348 L290 322" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="566" y="320" text-anchor="start" fill="#a35f4c">肌突</text>
                <path d="M562 316 L486 316" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="380" y="440" text-anchor="middle">后方 · 声门后部</text>
              </g>
            </svg>'''

          pattern = re.compile('<svg id="mechMap"[\\s\\S]*?</svg>')
          if len(pattern.findall(t)) != 1:
              sys.exit('ABORT: mechMap svg not uniquely found')
          t = pattern.sub(lambda m: new_svg, t, count=1)

          for token in ('data-version="6"', 'stroke="url(#foldLGrad)"', 'id="aryLeft"', 'M300 348 Q380 394'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)

          p.write_text(t, encoding='utf-8')
          print('v6 written,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "feat(anatomy): v6 — arytenoids joined to the folds, posterior glottis merged"
            git push
          fi
