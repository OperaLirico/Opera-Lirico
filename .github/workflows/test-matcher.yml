name: Test personalized opportunity matcher

on:
  pull_request:
    paths:
      - "content_engine/matcher.py"
      - "tests/**"
      - ".github/workflows/test-matcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run matcher tests
        run: python -m unittest tests.test_matcher -v
