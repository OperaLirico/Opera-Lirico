name: Larynx map realistic v5

on:
  push:
    paths:
      - content/larynx-map-v5.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repaint v5 — thicker folds, real arytenoid shape, closed resting glottis
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="5"' in t:
              print('already v5')
              raise SystemExit(0)

          new_svg = '''<svg id="mechMap" data-version="5" viewBox="0 0 760 460" data-state="pca" role="img" aria-labelledby="mechMapTitle mechMapDesc">
              <title id="mechMapTitle">声门形态随喉内肌机制变化的示意图</title>
              <desc id="mechMapDesc">上方为前联合，下方为两侧杓状软骨的声门示意图。选择机制时声带与杓状软骨绕前联合转动，箭头标出运动方向；为示意性质，不是真实组织形变。</desc>
              <defs>
                <radialGradient id="bgGrad" cx="380" cy="240" r="330" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#fbf3ee"/>
                  <stop offset="1" stop-color="#ece0d7"/>
                </radialGradient>
                <radialGradient id="airGrad" cx="380" cy="250" r="150" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#3b4c46"/>
                  <stop offset="0.6" stop-color="#22302c"/>
                  <stop offset="1" stop-color="#141d1a"/>
                </radialGradient>
                <linearGradient id="foldLGrad" x1="1" y1="0" x2="0" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>
                </linearGradient>
                <linearGradient id="foldRGrad" x1="0" y1="0" x2="1" y2="0.2">
                  <stop offset="0" stop-color="#b9705f"/>
                  <stop offset="0.35" stop-color="#d99e8d"/>
                  <stop offset="0.75" stop-color="#eec4b6"/>
                  <stop offset="1" stop-color="#f8e2d8"/>
                </linearGradient>
                <radialGradient id="cartGrad" cx="0.4" cy="0.34" r="0.75">
                  <stop offset="0" stop-color="#fdfaf2"/>
                  <stop offset="0.55" stop-color="#eee6d4"/>
                  <stop offset="1" stop-color="#d5c8ae"/>
                </radialGradient>
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8a6a5c" flood-opacity="0.22"/>
                </filter>
                <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5f4238" flood-opacity="0.3"/>
                </filter>
                <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0 0 L10 5 L0 10 z" fill="#b07a5f"/>
                </marker>
              </defs>
              <rect x="0" y="0" width="760" height="460" fill="url(#bgGrad)"/>
              <path d="M300 366 Q380 410 460 366 L474 392 Q380 438 286 392 Z" fill="url(#cartGrad)" stroke="#c6bba2" stroke-width="1.4"/>
              <path d="M380 84 C366 158 356 236 352 298 L408 298 C404 236 394 158 380 84 Z" fill="url(#airGrad)"/>
              <g id="sideLeft" class="side">
                <g filter="url(#foldShadow)">
                  <path d="M380 80 C362 162 350 238 346 300" stroke="url(#foldLGrad)" stroke-width="23" stroke-linecap="round" fill="none"/>
                </g>
                <path d="M379 92 C364 166 355 234 351 292" stroke="#fff4ec" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
                <g id="aryLeft" class="ary" filter="url(#softShadow)">
                  <path d="M322 300 C300 298 286 316 288 338 C290 360 310 372 330 364 C352 356 358 334 348 316 C340 302 332 300 322 300 Z" fill="url(#cartGrad)" stroke="#b9ad95" stroke-width="1.6"/>
                  <path d="M320 300 L348 290 L330 316 Z" fill="#f3ecdb" stroke="#b9ad95" stroke-width="1.3"/>
                  <path d="M292 336 L274 344 L292 354 Z" fill="#eae1cd" stroke="#b9ad95" stroke-width="1.3"/>
                  <circle cx="318" cy="298" r="6.5" fill="#f8f2e4" stroke="#c0b49d" stroke-width="1.2"/>
                  <ellipse cx="316" cy="330" rx="15" ry="11" fill="#ffffff" opacity="0.32"/>
                  <circle cx="278" cy="344" r="3.4" fill="#a35f4c"/>
                </g>
              </g>
              <g id="sideRight" class="side">
                <g filter="url(#foldShadow)">
                  <path d="M380 80 C398 162 410 238 414 300" stroke="url(#foldRGrad)" stroke-width="23" stroke-linecap="round" fill="none"/>
                </g>
                <path d="M381 92 C396 166 405 234 409 292" stroke="#fff4ec" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
                <g id="aryRight" class="ary" filter="url(#softShadow)">
                  <path d="M438 300 C460 298 474 316 472 338 C470 360 450 372 430 364 C408 356 402 334 412 316 C420 302 428 300 438 300 Z" fill="url(#cartGrad)" stroke="#b9ad95" stroke-width="1.6"/>
                  <path d="M440 300 L412 290 L430 316 Z" fill="#f3ecdb" stroke="#b9ad95" stroke-width="1.3"/>
                  <path d="M468 336 L486 344 L468 354 Z" fill="#eae1cd" stroke="#b9ad95" stroke-width="1.3"/>
                  <circle cx="442" cy="298" r="6.5" fill="#f8f2e4" stroke="#c0b49d" stroke-width="1.2"/>
                  <ellipse cx="444" cy="330" rx="15" ry="11" fill="#ffffff" opacity="0.32"/>
                  <circle cx="482" cy="344" r="3.4" fill="#a35f4c"/>
                </g>
              </g>
              <g id="arrowsOpen" class="arrow-g">
                <path d="M338 250 L288 240" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M422 250 L472 240" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsClose" class="arrow-g">
                <path d="M290 254 L336 262" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M470 254 L424 262" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsMid" class="arrow-g">
                <path d="M298 348 L348 348" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M462 348 L412 348" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsThick" class="arrow-g">
                <path d="M338 196 L302 196" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M422 196 L458 196" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsLong" class="arrow-g">
                <path d="M380 150 L380 240" stroke="#b07a5f" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g font-family="system-ui,sans-serif" font-size="13" fill="#5b6860">
                <text x="380" y="44" text-anchor="middle">前联合</text>
                <text x="190" y="244" text-anchor="end">声带</text>
                <path d="M194 240 L318 246" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="186" y="386" text-anchor="end">杓状软骨</text>
                <path d="M190 382 L286 360" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="566" y="348" text-anchor="start" fill="#a35f4c">肌突</text>
                <path d="M562 344 L490 344" stroke="#d3c9be" stroke-width="1.4" fill="none"/>
                <text x="380" y="448" text-anchor="middle">后方 · 声门后部</text>
              </g>
            </svg>'''

          pattern = re.compile('<svg id="mechMap"[\\s\\S]*?</svg>')
          if len(pattern.findall(t)) != 1:
              sys.exit('ABORT: mechMap svg not uniquely found')
          t = pattern.sub(lambda m: new_svg, t, count=1)

          for token in ('data-version="5"', 'stroke="url(#foldLGrad)"', 'id="aryLeft"', 'airGrad'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)

          p.write_text(t, encoding='utf-8')
          print('v5 written,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "feat(anatomy): v5 drawing — thick mucosal folds, pear-shaped arytenoids, closed resting glottis"
            git push
          fi
