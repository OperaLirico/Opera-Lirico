name: Larynx map v8 mucosa

on:
  push:
    paths:
      - content/larynx-map-v8.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repaint v8 — mucosa palette applied with correct match counts
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="8"' in t:
              print('already v8')
              raise SystemExit(0)
          if 'data-version="6"' not in t:
              sys.exit('ABORT: expected the v6 diagram as the base')

          def swap(old, new, label, n=1):
              global t
              c = t.count(old)
              if c != n:
                  sys.exit('ABORT: %s expected %d matches, got %d' % (label, n, c))
              t = t.replace(old, new, n)

          swap('data-version="6"', 'data-version="8"', 'version')

          swap('<stop offset="0" stop-color="#fbf3ee"/>', '<stop offset="0" stop-color="#f7efe9"/>', 'bg inner')
          swap('<stop offset="1" stop-color="#ece0d7"/>', '<stop offset="1" stop-color="#e4d2c9"/>', 'bg outer')
          swap('<stop offset="0" stop-color="#3d4e48"/>', '<stop offset="0" stop-color="#33302f"/>', 'air inner')
          swap('<stop offset="0.55" stop-color="#23312d"/>', '<stop offset="0.55" stop-color="#1a1e1f"/>', 'air mid')
          swap('<stop offset="1" stop-color="#151f1c"/>', '<stop offset="1" stop-color="#0d1011"/>', 'air outer')

          swap('<stop offset="0" stop-color="#b9705f"/>', '<stop offset="0" stop-color="#ad6a5c"/>', 'fold dark', 2)
          swap('<stop offset="0.35" stop-color="#d99e8d"/>', '<stop offset="0.3" stop-color="#d29486"/>', 'fold mid', 2)
          swap('<stop offset="0.75" stop-color="#eec4b6"/>', '<stop offset="0.7" stop-color="#eab9ac"/>', 'fold light', 2)
          swap('<stop offset="1" stop-color="#f8e2d8"/>', '<stop offset="1" stop-color="#f9e2d8"/>', 'fold edge', 2)

          swap('<stop offset="0" stop-color="#fdfaf2"/>', '<stop offset="0" stop-color="#f7d3c8"/>', 'cart inner')
          swap('<stop offset="0.55" stop-color="#eee6d4"/>', '<stop offset="0.55" stop-color="#e2a89b"/>', 'cart mid')
          swap('<stop offset="1" stop-color="#d5c8ae"/>', '<stop offset="1" stop-color="#c7857a"/>', 'cart outer')

          swap('stroke="#c6bba2" stroke-width="1.4"', 'stroke="#b8837a" stroke-width="1"', 'posterior bridge edge')
          swap('stroke="#b9ad95" stroke-width="1.6"', 'stroke="#b9837a" stroke-width="1.2"', 'arytenoid edge', 2)
          swap('stroke="#b9ad95" stroke-width="1.3"', 'stroke="#b9837a" stroke-width="1.2"', 'process edge', 4)
          swap('stroke="#c0b49d" stroke-width="1.2"', 'stroke="#bf8b81" stroke-width="1.1"', 'corniculate edge', 2)

          swap('fill="#f3ecdb"', 'fill="#efc7bc"', 'vocal process fill', 2)
          swap('fill="#eae1cd"', 'fill="#e6b3a7"', 'muscular process fill', 2)
          swap('fill="#f8f2e4"', 'fill="#f5d9cf"', 'corniculate fill', 2)

          for token in ('data-version="8"', '#f7d3c8', '#ad6a5c', '#efc7bc', '#e6b3a7'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)

          p.write_text(t, encoding='utf-8')
          print('v8 written,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "feat(anatomy): v8 — endoscopic mucosa palette"
            git push
          fi
