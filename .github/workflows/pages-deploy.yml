name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "site-config.js"
      - "analytics.js"
      - "styles.css"
      - "extra.css"
      - "icon.svg"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "data/conservatori.json"
      - "masterclasses.html"
      - "data/masterclasses.json"
      - "data/opportunities.json"
      - "data/repertoire.json"
      - "data/pdfs/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Validate published masterclass records
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          data = json.loads(Path("data/masterclasses.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("data/masterclass.schema.json").read_text(encoding="utf-8"))
          items = data.get("items", [])
          ids = [item.get("id") for item in items]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate masterclass IDs detected")
          for index, item in enumerate(items, 1):
              missing = [key for key in schema.get("required", []) if not item.get(key)]
              if missing:
                  raise SystemExit(f"Masterclass #{index} missing required fields: {missing}")
              if item.get("publisher_status") != "official" or item.get("review_status") != "verified" or item.get("publication_status") != "published":
                  raise SystemExit(f"Masterclass #{index} is not eligible for public display")
              if not str(item.get("source_url", "")).startswith("https://"):
                  raise SystemExit(f"Masterclass #{index} has an invalid source URL")
              evidence = item.get("evidence") or []
              if not evidence:
                  raise SystemExit(f"Masterclass #{index} has no evidence")
              for record in evidence:
                  if not str(record.get("url", "")).startswith("https://") or not str(record.get("excerpt", "")).strip():
                      raise SystemExit(f"Masterclass #{index} has incomplete evidence")
                  datetime.fromisoformat(record["checked_at"])
              if item.get("start_at") and item.get("end_at"):
                  if datetime.fromisoformat(item["end_at"]) < datetime.fromisoformat(item["start_at"]):
                      raise SystemExit(f"Masterclass #{index} ends before it starts")
          print(f"Validated {len(items)} published masterclass records.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
