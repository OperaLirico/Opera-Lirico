name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    # 改用 paths-ignore：影响站点的改动一律触发构建。
    # 旧的白名单法漏过 hero-calls.css / theme-wine.css / taste-fix.css 等文件，
    # 纯样式提交不触发部署，线上会停在旧产物。
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - ".agents/**"
      - "**/*.md"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
# Do not rerun a failed job after the Pages artifact upload: each retry adds
# another github-pages artifact to the same workflow run. deploy-pages requires
# exactly one artifact; if deployment fails, start a fresh workflow run instead.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Validate published masterclass records
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          data = json.loads(Path("data/masterclasses.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("data/masterclass.schema.json").read_text(encoding="utf-8"))
          items = data.get("items", [])
          ids = [item.get("id") for item in items]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate masterclass IDs detected")
          for index, item in enumerate(items, 1):
              missing = [key for key in schema.get("required", []) if not item.get(key)]
              if missing:
                  raise SystemExit(f"Masterclass #{index} missing required fields: {missing}")
              if item.get("publisher_status") != "official" or item.get("review_status") != "verified" or item.get("publication_status") != "published":
                  raise SystemExit(f"Masterclass #{index} is not eligible for public display")
              if not str(item.get("source_url", "")).startswith("https://"):
                  raise SystemExit(f"Masterclass #{index} has an invalid source URL")
              evidence = item.get("evidence") or []
              if not evidence:
                  raise SystemExit(f"Masterclass #{index} has no evidence")
              for record in evidence:
                  if not str(record.get("url", "")).startswith("https://") or not str(record.get("excerpt", "")).strip():
                      raise SystemExit(f"Masterclass #{index} has incomplete evidence")
                  datetime.fromisoformat(record["checked_at"])
              if item.get("start_at") and item.get("end_at"):
                  if datetime.fromisoformat(item["end_at"]) < datetime.fromisoformat(item["start_at"]):
                      raise SystemExit(f"Masterclass #{index} ends before it starts")
          print(f"Validated {len(items)} published masterclass records.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Generate social preview PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="og-image.svg", write_to="og-image.png", output_width=1200, output_height=630)
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      # The artifact service can take a short time to expose a just-finalized
      # Pages artifact through the REST metadata endpoint. deploy-pages fails
      # immediately if that list is temporarily empty, even when upload succeeded.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              -o /tmp/pages-artifacts.json
            count="$(jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' /tmp/pages-artifacts.json)"
            if [ "$count" -eq 1 ]; then
              echo "Pages artifact metadata is visible."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)..."
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become visible to the deployment API."
          exit 1
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
