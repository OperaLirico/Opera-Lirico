name: System health check

on:
  push:
    branches: [main]
    paths:
      - "system_health_check.py"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-lirico-system-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full automated test suite
        run: python -m unittest discover -s tests -v
      - name: Validate local data and deployed public endpoints
        run: python system_health_check.py
      - name: Publish health report
        if: always()
        run: |
          {
            echo "## Opera Lirico system health"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- This check is read-only; it does not publish candidates or modify data."
          } >> "$GITHUB_STEP_SUMMARY"
