name: System health check

on:
  push:
    branches: [main]
    paths:
      - "system_health_check.py"
      - "analytics_watchdog.py"
      - "tests/test_workflow_separation.py"
      - ".github/workflows/system-health-check.yml"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-lirico-system-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      # One retry per gate. A single flaky network call used to turn the whole
      # daily check red, which then had to be triaged by hand every morning.
      - name: Run full automated test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v \
            || (echo "::warning::test suite failed once; retrying in 45s" && sleep 45 && python -m unittest discover -s tests -v)
      - name: Validate local data and deployed public endpoints
        run: |
          set -o pipefail
          python system_health_check.py \
            || (echo "::warning::health check failed once; retrying in 45s" && sleep 45 && python system_health_check.py)
      - name: Publish health report
        if: always()
        run: |
          {
            echo "## Opera Lirico system health"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Retry policy: each gate is attempted twice before the run is marked failed."
            echo "- This check is read-only; it does not publish candidates or modify data."
          } >> "$GITHUB_STEP_SUMMARY"
