name: REA data gate

on:
  push:
    paths:
      - data/voice-structures.json
      - research/evidence.json
      - research/**
  pull_request:
    paths:
      - data/voice-structures.json
      - research/**
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the fact store
        run: python3 research/validate.py
