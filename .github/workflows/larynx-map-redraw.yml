name: Larynx map redraw

on:
  push:
    paths:
      - content/larynx-map-redraw.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace the glottis diagram with the heavier anatomical version
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="2"' in t:
              print('already redrawn')
              raise SystemExit(0)

          new_svg = '''<svg id="mechMap" data-version="2" viewBox="0 0 760 460" data-state="pca" role="img" aria-labelledby="mechMapTitle mechMapDesc">
              <title id="mechMapTitle">声门形态随喉内肌机制变化的示意图</title>
              <desc id="mechMapDesc">上方为前联合、下方为两侧杓状软骨。选机制时声带与杓状软骨整体转动，箭头标出运动方向；这是示意图，不是真实组织形变。</desc>
              <defs>
                <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0 0 L10 5 L0 10 z" fill="#9a6c58"/>
                </marker>
              </defs>
              <g>
                <path d="M300 396 Q380 434 460 396" fill="none" stroke="#c8d5cc" stroke-width="13"/>
                <path d="M330 368 Q380 394 430 368" fill="none" stroke="#e2ebe4" stroke-width="9"/>
              </g>
              <path d="M380 84 C352 170 342 250 338 298 L422 298 C418 250 408 170 380 84 Z" fill="#cfe0d8"/>
              <g id="sideLeft" class="side">
                <path d="M380 80 C354 162 342 242 338 298 L316 298 C320 238 338 158 372 78 Z" fill="#e3bcb0" stroke="#a4645a" stroke-width="2" stroke-linejoin="round"/>
                <g id="aryLeft" class="ary">
                  <path d="M326 280 C304 278 290 300 292 326 C294 352 316 368 336 360 C356 352 364 328 356 308 C350 290 338 280 326 280 Z" fill="#edf3ed" stroke="#23483c" stroke-width="2.5"/>
                  <path d="M338 292 L358 284 L342 312 Z" fill="#dfe8e1" stroke="#23483c" stroke-width="2"/>
                  <circle cx="292" cy="322" r="5" fill="#9a6c58"/>
                </g>
              </g>
              <g id="sideRight" class="side">
                <path d="M380 80 C406 162 418 242 422 298 L444 298 C440 238 422 158 380 78 Z" fill="#e3bcb0" stroke="#a4645a" stroke-width="2" stroke-linejoin="round"/>
                <g id="aryRight" class="ary">
                  <path d="M434 280 C456 278 470 300 468 326 C466 352 444 368 424 360 C404 352 396 328 404 308 C410 290 422 280 434 280 Z" fill="#edf3ed" stroke="#23483c" stroke-width="2.5"/>
                  <path d="M422 292 L402 284 L418 312 Z" fill="#dfe8e1" stroke="#23483c" stroke-width="2"/>
                  <circle cx="468" cy="322" r="5" fill="#9a6c58"/>
                </g>
              </g>
              <g id="arrowsOpen" class="arrow-g">
                <path d="M332 244 L282 236" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M428 244 L478 236" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsClose" class="arrow-g">
                <path d="M286 248 L330 256" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M474 248 L430 256" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsMid" class="arrow-g">
                <path d="M296 336 L342 336" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M464 336 L418 336" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsThick" class="arrow-g">
                <path d="M336 206 L300 206" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
                <path d="M352 206 L388 206" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsLong" class="arrow-g">
                <path d="M380 150 L380 240" stroke="#9a6c58" stroke-width="3" fill="none" marker-end="url(#ah)"/>
              </g>
              <g font-family="system-ui,sans-serif" font-size="13" fill="#557165">
                <text x="380" y="36" text-anchor="middle">前联合</text>
                <text x="196" y="212" text-anchor="end">声带</text>
                <path d="M200 208 L322 214" stroke="#d8e2db" stroke-width="1.4" fill="none"/>
                <text x="200" y="344" text-anchor="end">杓状软骨</text>
                <path d="M204 340 L292 338" stroke="#d8e2db" stroke-width="1.4" fill="none"/>
                <text x="560" y="326" text-anchor="start" fill="#9a6c58">肌突</text>
                <path d="M556 322 L476 322" stroke="#d8e2db" stroke-width="1.4" fill="none"/>
                <text x="380" y="432" text-anchor="middle">后方 · 声门后部</text>
              </g>
            </svg>'''

          pattern = re.compile('<svg id="mechMap"[\\s\\S]*?</svg>')
          found = pattern.findall(t)
          if len(found) != 1:
              sys.exit('ABORT: expected 1 mechMap svg, got %d' % len(found))
          t = pattern.sub(lambda m: new_svg, t, count=1)

          old_css = '.mech-map .side{transform-box:view-box;transform-origin:380px 64px;'
          if t.count(old_css) != 1:
              sys.exit('ABORT: transform-origin anchor missing')
          t = t.replace(old_css, '.mech-map .side{transform-box:view-box;transform-origin:380px 72px;', 1)

          note_css = '.mech-map-note{margin:8px 4px 2px;'
          if t.count(note_css) != 1:
              sys.exit('ABORT: note css anchor missing')
          arrows_css = (
              '.mech-map .arrow-g{opacity:0;transition:opacity .3s ease}\n'
              '#mechMap[data-state="pca"] #arrowsOpen{opacity:1}\n'
              '#mechMap[data-state="lca"] #arrowsClose{opacity:1}\n'
              '#mechMap[data-state="ia"] #arrowsMid{opacity:1}\n'
              '#mechMap[data-state="ta"] #arrowsThick{opacity:1}\n'
              '#mechMap[data-state="ct"] #arrowsLong{opacity:1}\n'
              '@media(max-width:640px){.mech-map svg{max-height:360px}}\n'
          )
          t = t.replace(note_css, arrows_css + note_css, 1)

          for token in ('data-version="2"', '#arrowsOpen', 'marker id="ah"', 'transform-origin:380px 72px'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)

          p.write_text(t, encoding='utf-8')
          print('redrawn, now', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "feat(anatomy): redraw the glottis diagram with tissue bands and motion arrows"
            git push
          fi
