name: ERA Research Engine Integration

on:
  pull_request:
    paths:
      - "scrape_sources.py"
      - "scrape_conservatori.py"
      - "run_conservatori.py"
      - "grow_sources.py"
      - "requirements.txt"
      - ".github/workflows/daily-scrape-and-publish.yml"
      - ".github/workflows/weekly-source-discovery.yml"
      - ".github/workflows/era-engine-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OperaLab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout shared ERA Research Engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wl19971007-lgtm/ERA
          ref: 08e8e63be4a9bad4f44893460aafce44afc74ba8
          token: ${{ secrets.ERA_REPO_TOKEN }}
          path: .era
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install OperaLab and ERA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .era/tools/research-engine
      - name: Install optional Scrapling provider
        run: |
          if python -m pip install "scrapling[fetchers]>=0.5.1,<0.6.0"; then
            echo "Scrapling provider installed."
          else
            echo "::warning::Scrapling unavailable; the standard-library provider remains available."
          fi
      - name: Verify collector imports and syntax
        run: |
          python -m py_compile scrape_sources.py scrape_conservatori.py run_conservatori.py grow_sources.py
          python -c "from era_research.compat import Fetcher; print('ERA collector compatibility ready:', Fetcher.__name__)"
      - name: Run OperaLab regression tests
        run: python -m unittest discover -s tests -v
