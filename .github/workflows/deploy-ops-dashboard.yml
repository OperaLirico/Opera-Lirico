name: Deploy private operations dashboard

on:
  push:
    branches: [main]
    paths:
      - "ops-dashboard/**"
      - ".github/workflows/deploy-ops-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-lirico-ops-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Provision private content draft storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          HTTP_STATUS="$(curl -sS -o /tmp/kv-namespaces.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Cloudflare denied KV namespace access (HTTP $HTTP_STATUS). Add Workers KV Storage: Edit permission to CF_WORKERS_DEPLOY_TOKEN, scoped to this account, then update the GitHub Actions secret."
            exit 1
          fi
          jq -e '.success == true' /tmp/kv-namespaces.json >/dev/null
          KV_ID="$(jq -r '.result[] | select(.title == "opera-lirico-content-drafts") | .id' /tmp/kv-namespaces.json | head -n1)"
          if [ -z "$KV_ID" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"title":"opera-lirico-content-drafts"}' "$API" > /tmp/kv-created.json
            jq -e '.success == true' /tmp/kv-created.json >/dev/null
            KV_ID="$(jq -r '.result.id // empty' /tmp/kv-created.json)"
          fi
          if [ -z "$KV_ID" ]; then
            echo "::error::Unable to provision or identify the content draft KV namespace."
            exit 1
          fi
          cp ops-dashboard/wrangler.toml ops-dashboard/wrangler.generated.toml
          printf '\n[[kv_namespaces]]\nbinding = "CONTENT_DRAFTS"\nid = "%s"\n' "$KV_ID" >> ops-dashboard/wrangler.generated.toml
          echo "Private content storage binding is ready."
      - name: Validate required secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKERS_DEPLOY_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          OPS_DASHBOARD_PASSWORD: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CF_ACCOUNT_ID CF_WORKERS_DEPLOY_TOKEN CF_ANALYTICS_API_TOKEN BUTTONDOWN_API_KEY OPS_DASHBOARD_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [ "${#OPS_DASHBOARD_PASSWORD}" -lt 32 ]; then
            echo "::error::OPS_DASHBOARD_PASSWORD must be at least 32 characters."
            exit 1
          fi
      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --config ops-dashboard/wrangler.generated.toml

      - name: Upload runtime secrets to the protected Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          OPS_DASHBOARD_PASSWORD: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler secret put CF_ACCOUNT_ID --config ops-dashboard/wrangler.generated.toml
          printf '%s' "$CF_ANALYTICS_API_TOKEN" | wrangler secret put CF_ANALYTICS_API_TOKEN --config ops-dashboard/wrangler.generated.toml
          printf '%s' "$BUTTONDOWN_API_KEY" | wrangler secret put BUTTONDOWN_API_KEY --config ops-dashboard/wrangler.generated.toml
          printf '%s' "$OPS_DASHBOARD_PASSWORD" | wrangler secret put OPS_DASHBOARD_PASSWORD --config ops-dashboard/wrangler.generated.toml
