name: Pages deploy path fix

on:
  push:
    paths:
      - content/pages-paths-fix.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add the new pages and asset glob to the deploy trigger paths
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path('.github/workflows/pages-deploy.yml')
          t = p.read_text(encoding='utf-8')
          if '- "larynx-mechanism.html"' in t:
              print('already patched, nothing to do')
              raise SystemExit(0)
          anchor = '      - "voice-anatomy.html"\n'
          if t.count(anchor) != 1:
              sys.exit('ABORT: anchor count != 1')
          add = anchor + '      - "larynx-mechanism.html"\n      - "assets/**"\n'
          t = t.replace(anchor, add, 1)
          p.write_text(t, encoding='utf-8')
          print('patched pages-deploy.yml')
          PY

      - name: Validate the workflow file
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/pages-deploy.yml',encoding='utf-8')); print('yaml ok')"

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/workflows/pages-deploy.yml
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "ci(pages): deploy on anatomy asset and larynx page changes"
            git push
          fi
