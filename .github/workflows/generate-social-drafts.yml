name: Generate social content drafts
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
permissions:
  contents: write
concurrency:
  group: social-content-drafts
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate drafts from verified published records
        run: python content_engine/generate.py
      - name: Commit draft assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/drafts
          if ! git diff --cached --quiet; then
            git commit -m "Generate daily social content drafts"
            git push origin HEAD:main
          fi
