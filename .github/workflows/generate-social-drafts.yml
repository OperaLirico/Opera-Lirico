name: Generate social content drafts
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
permissions:
  contents: read
concurrency:
  group: social-content-drafts
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate drafts from verified published records
        run: python content_engine/generate.py
      - name: Store drafts as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: opera-lirico-social-drafts
          path: build/social-drafts/
          if-no-files-found: error
          retention-days: 7
