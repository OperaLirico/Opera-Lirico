name: cycle 6 log

on:
  push:
    paths:
      - content/cycle6-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Append the cycle 6 entry
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('docs/rea-cycle-log.md')
          t = p.read_text(encoding='utf-8')
          marker = '第 6 轮 · 2026-11-18'
          if marker in t:
              print('already logged')
          else:
              p.write_text(t + pathlib.Path('content/cycle6-note.md').read_text(encoding='utf-8'), encoding='utf-8')
              print('appended')
          PY
      - name: Commit
        run: |
          git config user.name "OperaLab Bot"
          git config user.email "bot@operalirico.github.io"
          git add docs/rea-cycle-log.md
          git diff --cached --quiet || git commit -m "docs(rea): log cycle 6 (membership and subscription teardown)"
          git push
