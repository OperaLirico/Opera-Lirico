name: Isolated Docling PDF pilot

on:
  push:
    branches:
      - "experiment/pdf-parser/**"
    paths:
      - "experiments/pdf-parser/**"
      - "data/pdfs/**"
      - ".github/audits/pdf-integrity-manifest.json"
      - ".github/workflows/docling-pdf-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-docling-pdf-pilot
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: experiments/pdf-parser/requirements.txt
      - name: Install isolated Docling dependency
        run: python -m pip install -r experiments/pdf-parser/requirements.txt
      - name: Run local PDF evaluation
        run: python experiments/pdf-parser/run_docling_evaluation.py
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: isolated-docling-pdf-evaluation
          path: artifacts/docling-evaluation/
          if-no-files-found: error
          retention-days: 90
