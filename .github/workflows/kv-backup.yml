name: KV backup

# Nightly encrypted snapshot of the private content draft KV namespace.
#
# This workflow deliberately reuses a secret that already exists, so the backup
# path works without provisioning anything new:
#   OPS_DASHBOARD_PASSWORD -> bearer for /api/admin/backup and GPG passphrase.
# Both the worker and this job read the same secret, so rotating the dashboard
# password keeps the backup working after the next dashboard deploy.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-lirico-kv-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check backup configuration
        id: config
        env:
          BACKUP_TOKEN: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$BACKUP_TOKEN" ] || [ "${#BACKUP_TOKEN}" -lt 32 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::OPS_DASHBOARD_PASSWORD is missing or shorter than 32 characters, so the nightly KV backup cannot run."
            echo "Add the OPS_DASHBOARD_PASSWORD repository secret (32+ characters) under Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Export and encrypt KV data
        if: steps.config.outputs.configured == 'true'
        env:
          BACKUP_TOKEN: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
          ENCRYPTION_KEY: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/opera-lirico-backup.json"
          ENC="$RUNNER_TEMP/opera-lirico-backup.gpg"
          VERIFY="$RUNNER_TEMP/opera-lirico-verify.json"
          trap 'rm -f "$RAW" "$VERIFY"' EXIT
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            -H "Accept: application/json" \
            "https://opera-lirico-ops.wl19971007.workers.dev/api/admin/backup" \
            -o "$RAW"
          jq -e '.format == "opera-lirico-kv-backup-v1" and (.items | type == "array") and (.key_count == (.items | length))' "$RAW" >/dev/null
          printf '%s' "$ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$ENC" "$RAW"
          printf '%s' "$ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$VERIFY" "$ENC"
          jq -e '.format == "opera-lirico-kv-backup-v1" and (.key_count == (.items | length))' "$VERIFY" >/dev/null
          echo "KEY_COUNT=$(jq -r '.key_count' "$RAW")" >> "$GITHUB_ENV"
          echo "EXPORTED_AT=$(jq -r '.exported_at' "$RAW")" >> "$GITHUB_ENV"
          rm -f "$RAW" "$VERIFY"
          # ENC is already in RUNNER_TEMP; moving it to the same path fails.
          test -s "$ENC"
      - name: Upload encrypted backup
        id: upload
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opera-lirico-kv-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/opera-lirico-backup.gpg
          if-no-files-found: error
          retention-days: 90
      - name: Retry encrypted backup upload
        id: upload_retry
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opera-lirico-kv-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/opera-lirico-backup.gpg
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Download uploaded backup for restore verification
        if: steps.upload.outcome == 'success' || steps.upload_retry.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opera-lirico-kv-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/opera-lirico-backup-restore-test
      - name: Verify uploaded backup decrypts and passes payload checks
        if: steps.upload.outcome == 'success' || steps.upload_retry.outcome == 'success'
        env:
          ENCRYPTION_KEY: ${{ secrets.OPS_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/opera-lirico-restore-verify.json"
          printf '%s' "$ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$VERIFY" "$RUNNER_TEMP/opera-lirico-backup-restore-test/opera-lirico-backup.gpg"
          jq -e '.format == "opera-lirico-kv-backup-v1" and (.items | type == "array") and (.key_count == (.items | length))' "$VERIFY" >/dev/null
          RESTORED_KEY_COUNT="$(jq -r '.key_count' "$VERIFY")"
          test "$RESTORED_KEY_COUNT" = "$KEY_COUNT"
          rm -f "$VERIFY"
      - name: Remove temporary encrypted backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/opera-lirico-backup.gpg" "$RUNNER_TEMP/opera-lirico-backup-restore-test" "$RUNNER_TEMP/opera-lirico-restore-verify.json"
      - name: Write backup report
        if: success() && steps.config.outputs.configured == 'true'
        run: |
          {
            echo "## KV backup"
            echo "- Result: encrypted artifact uploaded"
            echo "- Exported at: $EXPORTED_AT"
            echo "- KV keys: $KEY_COUNT"
            echo "- Retention: 90 days"
            echo "- Encryption: GPG symmetric AES-256 with OPS_DASHBOARD_PASSWORD"
            echo "- Artifact integrity verification: downloaded artifact decrypted and payload structure validated"
            echo "- Plaintext backup removed from runner."
          } >> "$GITHUB_STEP_SUMMARY"
