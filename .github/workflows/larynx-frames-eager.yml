name: Larynx frames eager

on:
  push:
    paths:
      - content/larynx-frames-eager.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Load all five frames up front
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'loading="lazy"' not in t:
              print('already eager')
              raise SystemExit(0)
          c = t.count(' loading="lazy"')
          if c != 4:
              sys.exit('ABORT: lazy attrs -> %d' % c)
          t = t.replace(' loading="lazy"', ' decoding="async"')
          if t.count('decoding="async"') != 4:
              sys.exit('ABORT: decoding attrs mismatch')
          p.write_text(t, encoding='utf-8')
          print('frames eager,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "perf(anatomy): preload all glottis frames so switching never flashes"
            git push
          fi
