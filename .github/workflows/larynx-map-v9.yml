name: Larynx map v9 mucosa surface

on:
  push:
    paths:
      - content/larynx-map-v9.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repaint v9 — one continuous mucosal surface instead of stitched parts
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path('larynx-mechanism.html')
          t = p.read_text(encoding='utf-8')
          if 'data-version="9"' in t:
              print('already v9')
              raise SystemExit(0)

          new_svg = '''<svg id="mechMap" data-version="9" viewBox="0 0 760 460" data-state="pca" role="img" aria-labelledby="mechMapTitle mechMapDesc">
              <title id="mechMapTitle">声门形态随喉内肌机制变化的示意图</title>
              <desc id="mechMapDesc">上方为前联合，下方为后联合。黏膜表面被中线分为左右两半，中间裂隙为声门；选择机制时两半绕前联合转动，裂隙变宽或变窄，箭头标出运动方向。为示意性质，不是解剖图谱。</desc>
              <defs>
                <radialGradient id="bgGrad" cx="380" cy="230" r="340" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#f8f0ea"/>
                  <stop offset="0.65" stop-color="#ecdcd4"/>
                  <stop offset="1" stop-color="#d9c3ba"/>
                </radialGradient>
                <radialGradient id="cavityGrad" cx="380" cy="190" r="230" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#2a2b2c"/>
                  <stop offset="0.7" stop-color="#141718"/>
                  <stop offset="1" stop-color="#0a0c0d"/>
                </radialGradient>
                <linearGradient id="foldLGrad" x1="1" y1="0.05" x2="0" y2="0.55">
                  <stop offset="0" stop-color="#f6ddd3"/>
                  <stop offset="0.28" stop-color="#e8b9ab"/>
                  <stop offset="0.66" stop-color="#d79b8d"/>
                  <stop offset="1" stop-color="#b97c6e"/>
                </linearGradient>
                <linearGradient id="foldRGrad" x1="0" y1="0.05" x2="1" y2="0.55">
                  <stop offset="0" stop-color="#f6ddd3"/>
                  <stop offset="0.28" stop-color="#e8b9ab"/>
                  <stop offset="0.66" stop-color="#d79b8d"/>
                  <stop offset="1" stop-color="#b97c6e"/>
                </linearGradient>
                <linearGradient id="backWallGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#c98a7d"/>
                  <stop offset="0.55" stop-color="#dc9f92"/>
                  <stop offset="1" stop-color="#edbfb2"/>
                </linearGradient>
                <radialGradient id="aryBulge" cx="0.5" cy="0.45" r="0.7">
                  <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
                  <stop offset="0.65" stop-color="#8f4f45" stop-opacity="0.13"/>
                  <stop offset="1" stop-color="#6f3a32" stop-opacity="0"/>
                </radialGradient>
                <filter id="surfaceShadow" x="-25%" y="-25%" width="150%" height="150%">
                  <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#6c3b32" flood-opacity="0.26"/>
                </filter>
                <filter id="wetEdge" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2.2"/>
                </filter>
                <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0 0 L10 5 L0 10 z" fill="#a9583f"/>
                </marker>
              </defs>
              <rect x="0" y="0" width="760" height="460" fill="url(#bgGrad)"/>
              <path d="M380 60 C332 142 300 236 268 328 Q380 376 492 328 C460 236 428 142 380 60 Z" fill="url(#cavityGrad)" filter="url(#surfaceShadow)"/>
              <g id="sideLeft" class="side">
                <path d="M380 74 C352 152 322 236 286 320 Q330 352 372 340 L380 74 Z" fill="url(#foldLGrad)"/>
                <path d="M377 88 C354 160 330 238 300 314 L306 316 C336 240 360 162 380 92 Z" fill="#fff6f0" opacity="0.55" filter="url(#wetEdge)"/>
                <g id="aryLeft" class="ary">
                  <ellipse cx="318" cy="300" rx="58" ry="44" fill="url(#aryBulge)"/>
                  <ellipse cx="330" cy="290" rx="20" ry="12" fill="#ffffff" opacity="0.16"/>
                </g>
              </g>
              <g id="sideRight" class="side">
                <path d="M380 74 C408 152 438 236 474 320 Q430 352 388 340 L380 74 Z" fill="url(#foldRGrad)"/>
                <path d="M383 88 C406 160 430 238 460 314 L454 316 C424 240 400 162 380 92 Z" fill="#fff6f0" opacity="0.55" filter="url(#wetEdge)"/>
                <g id="aryRight" class="ary">
                  <ellipse cx="442" cy="300" rx="58" ry="44" fill="url(#aryBulge)"/>
                  <ellipse cx="430" cy="290" rx="20" ry="12" fill="#ffffff" opacity="0.16"/>
                </g>
              </g>
              <path d="M268 328 Q380 384 492 328 Q380 354 268 328 Z" fill="url(#backWallGrad)"/>
              <g id="arrowsOpen" class="arrow-g">
                <path d="M330 226 L284 214" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
                <path d="M430 226 L476 214" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsClose" class="arrow-g">
                <path d="M286 240 L332 250" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
                <path d="M474 240 L428 250" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsMid" class="arrow-g">
                <path d="M300 282 L350 288" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
                <path d="M460 282 L410 288" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsThick" class="arrow-g">
                <path d="M336 178 L296 178" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
                <path d="M424 178 L464 178" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
              </g>
              <g id="arrowsLong" class="arrow-g">
                <path d="M380 140 L380 226" stroke="#a9583f" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
              </g>
              <g font-family="system-ui,sans-serif" font-size="13" fill="#5a504b">
                <text x="380" y="40" text-anchor="middle">前联合</text>
                <text x="186" y="222" text-anchor="end">声带（黏膜表面）</text>
                <path d="M190 218 L330 232" stroke="#cdbdb4" stroke-width="1.3" fill="none"/>
                <text x="170" y="316" text-anchor="end">杓状软骨隆起</text>
                <path d="M174 312 L272 304" stroke="#cdbdb4" stroke-width="1.3" fill="none"/>
                <text x="566" y="318" text-anchor="start" fill="#a9583f">肌突位置</text>
                <path d="M562 314 L478 306" stroke="#cdbdb4" stroke-width="1.3" fill="none"/>
                <text x="380" y="440" text-anchor="middle">后方 · 后联合与杓间区</text>
              </g>
            </svg>'''

          pattern = re.compile('<svg id="mechMap"[\\s\\S]*?</svg>')
          if len(pattern.findall(t)) != 1:
              sys.exit('ABORT: mechMap svg not uniquely found')
          t = pattern.sub(lambda m: new_svg, t, count=1)

          old_note = '联动的声门示意图只表示开合与张力的方向，不是经验证的三维生物力学仿真'
          new_note = '联动的声门示意图只表示开合与张力的方向，是示意性的号肉（黏膜）色块、不是解剖图谱，也不是经验证的三维生物力学仿真'
          if t.count(old_note) != 1:
              sys.exit('ABORT: disclaimer sentence not found once')
          t = t.replace(old_note, new_note, 1)

          for token in ('data-version="9"', 'id="sideLeft"', 'id="sideRight"', 'id="aryLeft"', 'id="aryRight"', 'id="arrowsOpen"', 'id="arrowsClose"', 'id="arrowsMid"', 'id="arrowsThick"', 'id="arrowsLong"', 'mesh'[:0] + 'marker id="ah"'):
              if token not in t:
                  sys.exit('ABORT: missing ' + token)
          if t.count('<svg') != t.count('</svg>'):
              sys.exit('ABORT: unbalanced svg tags')

          p.write_text(t, encoding='utf-8')
          print('v9 written,', len(t), 'chars')
          PY

      - name: Commit
        run: |
          git config user.name "opera-lirico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add larynx-mechanism.html
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "feat(anatomy): v9 mucosal surface model, realistic glottic view"
            git push
          fi
