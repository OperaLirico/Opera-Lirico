name: Weekly source discovery

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Discover conservatories
        run: python grow_conservatori.py
      - name: Discover and screen audition source candidates
        run: python grow_sources.py --discover
      - name: Save source registry refresh and pending candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/conservatori_extra.json data/sources_extra.json data/source_candidates.json data/source_fetch_policies.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update source discovery data and pending candidates'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No source discovery data changes."
          fi
