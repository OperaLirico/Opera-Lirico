name: Weekly source discovery

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditions-data-and-pages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Discover conservatories
        run: python grow_conservatori.py
      - name: Discover and verify audition sources
        run: python grow_sources.py --discover
      - name: Save approved source registries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/conservatori_extra.json data/sources_extra.json data/source_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Discover and register official vocal sources'
            git push origin HEAD:main
          else
            echo "No approved source registry changes."
          fi
