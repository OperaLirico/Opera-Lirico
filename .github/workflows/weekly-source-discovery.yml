name: Weekly source discovery

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout shared ERA Research Engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: wl19971007-lgtm/ERA
          ref: 08e8e63be4a9bad4f44893460aafce44afc74ba8
          token: ${{ secrets.ERA_REPO_TOKEN }}
          path: .era
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install scraping dependencies
        run: python -m pip install -r requirements.txt
      - name: Install shared ERA Research Engine
        run: python -m pip install -e .era/tools/research-engine
      - name: Install optional Scrapling provider
        run: |
          if python -m pip install "scrapling[fetchers]>=0.5.1,<0.6.0"; then
            echo "Scrapling provider installed; ERA will prefer it."
          else
            echo "::warning::Scrapling unavailable; ERA will continue with the standard-library provider."
          fi
      - name: Run source quality tests
        run: python -m unittest discover -s tests -v
      - name: Discover conservatories
        run: python grow_conservatori.py
      - name: Discover and screen audition source candidates
        run: python grow_sources.py --discover
      - name: Save source registry refresh and pending candidates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # grow_sources.py writes all four outputs below, including the merged
          # data/sources.json snapshot. Stage every generated output before rebase
          # so no generated working-tree changes are left unstaged.
          git add data/conservatori_extra.json data/sources_extra.json data/source_candidates.json data/source_fetch_policies.json data/sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update source discovery data and pending candidates'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No source discovery data changes."
          fi
