name: Check website copy changes

on:
  push:
    branches:
      - feature/repo-foundation
    paths:
      - "index.html"
      - "app.js"
      - ".github/workflows/check-site-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required homepage copy and landmarks
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "找到下一次登台的机会",
              "歌剧院招募与比赛",
              "音乐学院招生信息",
              "咏叹调与艺术歌曲",
              "官方招生文件",
          ]
          missing = [phrase for phrase in required if phrase not in html]
          if missing:
              raise SystemExit(f"Missing expected homepage text: {missing}")
          print("Homepage copy checks passed.")
          PY
