name: Check website copy changes

on:
  push:
    branches:
      - release/chinese-copy-update
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - ".github/workflows/check-site-copy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - ".github/workflows/check-site-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check JSON data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/conservatori_zh.json", "data/conservatori_manual.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          PY
      - name: Check homepage structure and Chinese copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          zh = json.loads(Path("data/conservatori_zh.json").read_text(encoding="utf-8"))

          # The four entry tiles are the backbone of the page: every panel needs an
          # entry point, so check the panel ids and the tile titles that label them.
          panels = ["open-calls", "conservatori", "music-library", "pdfs"]
          missing_panels = [p for p in panels if f'id="{p}"' not in html]
          if missing_panels:
              raise SystemExit(f"Missing panel sections: {missing_panels}")

          titles = ["歌剧", "入学考试", "咏叹调", "官方简章"]
          missing_titles = [t for t in titles if t not in html]
          if missing_titles:
              raise SystemExit(f"Missing tile titles: {missing_titles}")

          # The old automated summaries used to be repeated on every card. They
          # must not come back, and the rendered copy must not print raw URLs.
          placeholders = ["尚未人工翻译", "LiederNet 收录的声乐文本"]
          leftovers = [p for p in placeholders if p in html or p in app]
          if leftovers:
              raise SystemExit(f"Placeholder summary text is back: {leftovers}")

          if "/lieder/" in app and "cleanName" not in app:
              raise SystemExit("Raw LiederNet paths are rendered without cleaning")

          if len(zh.get("items", {})) < 50:
              raise SystemExit("Chinese conservatory summaries appear incomplete")

          print("Homepage structure and Chinese copy checks passed.")
          PY
