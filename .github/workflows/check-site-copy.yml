name: Check website copy changes

on:
  push:
    branches:
      - release/chinese-copy-update
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - ".github/workflows/check-site-copy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - ".github/workflows/check-site-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check JSON data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/conservatori_zh.json", "data/conservatori_manual.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          PY
      - name: Check page structure and data wiring
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")

          # The page is built on four entry tiles, each opening one panel.
          # Wording may change; the structure and the wiring must not.
          panels = ["open-calls", "conservatori", "music-library", "pdfs"]
          missing = [p for p in panels if f'id="{p}"' not in html]
          if missing:
              raise SystemExit(f"Missing panel sections: {missing}")

          if len(re.findall(r'<button class="tile"', html)) != 4:
              raise SystemExit("Expected exactly four entry tiles on the homepage")

          tile_titles = re.findall(r'<span class="tile-title">([^<]+)</span>', html)
          if len(tile_titles) != 4:
              raise SystemExit(f"Expected four tile titles, found {len(tile_titles)}")

          for panel in panels:
              if f'data-open="{panel}"' not in html:
                  raise SystemExit(f"No tile or nav entry points to panel {panel}")

          # Placeholder summaries may stay in the data, but must never reach the page.
          if "尚未人工翻译" in html:
              raise SystemExit("Placeholder summary text is rendered on the page")
          if "尚未人工翻译" not in app or "summaryOf" not in app:
              raise SystemExit("app.js lost the placeholder filter (summaryOf)")
          if "cleanName" not in app:
              raise SystemExit("app.js lost cleanName(); scraped field noise may leak into the UI")

          print(f"Tiles: {tile_titles}")
          print("Page structure checks passed.")
          PY
