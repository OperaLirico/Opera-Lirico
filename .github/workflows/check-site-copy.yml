name: Check website copy changes

on:
  push:
    branches:
      - release/chinese-copy-update
    paths:
      - "index.html"
      - "app.js"
      - "assets/opera-clean.css"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - "data/masterclasses.json"
      - "data/masterclass.schema.json"
      - "masterclasses.html"
      - "voice-anatomy.html"
      - "larynx-mechanism.html"
      - "assets/anatomy/**"
      - "content_engine/**"
      - ".github/workflows/generate-social-drafts.yml"
      - ".github/workflows/check-site-copy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - "data/masterclasses.json"
      - "data/masterclass.schema.json"
      - "masterclasses.html"
      - "voice-anatomy.html"
      - "larynx-mechanism.html"
      - "assets/anatomy/**"
      - "content_engine/**"
      - ".github/workflows/generate-social-drafts.yml"
      - ".github/workflows/check-site-copy.yml"
  workflow_dispatch:

concurrency:
  group: site-copy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check JSON data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/conservatori_zh.json", "data/conservatori_manual.json", "data/masterclasses.json", "data/masterclass.schema.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          PY
      - name: Test social content generation
        run: |
          pip install CairoSVG
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m compileall -q content_engine
          python content_engine/generate.py
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("build/social-drafts")
          index = json.loads((out / "index.json").read_text(encoding="utf-8"))
          if not index["items"]:
              raise SystemExit("Expected at least one verified opportunity draft.")
          for item in index["items"]:
              image = out / item["image"]
              caption = out / item["markdown"]
              if not image.is_file() or image.stat().st_size < 1000:
                  raise SystemExit(f"Missing or empty PNG for {item['id']}")
              if not caption.is_file() or caption.stat().st_size < 100:
                  raise SystemExit(f"Missing or empty caption for {item['id']}")
          print(f"Generated and verified {len(index['items'])} social draft(s).")
          PY
      - name: Check page structure and data wiring
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")

          # The homepage keeps four interactive panels; official documents live inside institution cards.
          # Wording may change; the structure and the wiring must not.
          panels = ["open-calls", "conservatori", "opera-academies", "music-library"]
          missing = [p for p in panels if f'id="{p}"' not in html]
          if missing:
              raise SystemExit(f"Missing panel sections: {missing}")

          tile_entries = re.findall(r'<(?:button|a) class="tile(?: tile-link)?', html)
          if len(tile_entries) != 6:
              raise SystemExit(f"Expected six independent homepage sections, found {len(tile_entries)}")
          if len(re.findall(r'<button class="tile"', html)) != 4:
              raise SystemExit("Expected four interactive data-panel entries")

          tile_titles = re.findall(r'<span class="tile-title">([^<]+)</span>', html)
          if len(tile_titles) != 6:
              raise SystemExit(f"Expected six homepage tile titles including masterclasses and voice anatomy, found {len(tile_titles)}")
          if 'href="voice-anatomy.html"' not in html:
              raise SystemExit("Voice anatomy learning lab entry link is missing")
          if 'href="masterclasses.html"' not in html:
              raise SystemExit("Masterclasses entry link is missing")
          clean_css = Path("assets/opera-clean.css").read_text(encoding="utf-8")
          if "@media (max-width:760px)" not in clean_css or "@media (prefers-reduced-motion:reduce)" not in clean_css:
              raise SystemExit("Responsive layout or reduced-motion support is missing")

          for panel in panels:
              if f'data-open="{panel}"' not in html:
                  raise SystemExit(f"No tile or nav entry points to panel {panel}")

          # Placeholder summaries may stay in the data, but must never reach the page.
          if "尚未人工翻译" in html:
              raise SystemExit("Placeholder summary text is rendered on the page")
          if "尚未人工翻译" not in app or "summaryOf" not in app:
              raise SystemExit("app.js lost the placeholder filter (summaryOf)")
          if "cleanName" not in app:
              raise SystemExit("app.js lost cleanName(); scraped field noise may leak into the UI")

          voice_page = Path("voice-anatomy.html").read_text(encoding="utf-8")
          required_voice_features = [
              'id="anatomyModelFrame"',
              'id="head-airway"',
              'data-model="head"',
              'data-model="pharynx"',
              'data-model="respiratory"',
              'data-model="diaphragm"',
              'data-model="larynx"',
              'id="modelCaption"',
              'id="modelCredit"',
              'data-organ-select="nose"',
              'data-organ-select="palate"',
              'data-organ-select="tongue"',
              'data-organ-select="pharynx"',
              'data-organ-select="larynx"',
              'data-organ-select="lungs"',
              'data-organ-select="diaphragm"',
              'data-breath="inhale"',
              'id="breathReadout"',
              'id="anatomy-sources-title"',
              'href="larynx-mechanism.html"',
              "NCBI Bookshelf",
              "Lions Voice Clinic",
              "Pharynx and Floor of Mouth",
              "杓状软骨",
              "前庭襞",
          ]
          missing_voice = [item for item in required_voice_features if item not in voice_page]
          if missing_voice:
              raise SystemExit(f"Voice anatomy page is missing expected anatomy/interaction elements: {missing_voice}")

          obsolete_schematics = ['id="bodyMap"', 'id="tractSvg"', 'id="palateControl"', 'id="tongueControl"', 'id="jawControl"']
          present_obsolete = [item for item in obsolete_schematics if item in voice_page]
          if present_obsolete:
              raise SystemExit(f"Obsolete hand-drawn anatomy controls remain on the page: {present_obsolete}")

          larynx_page = Path("larynx-mechanism.html").read_text(encoding="utf-8")
          required_larynx_features = [
              'id="larynxModelFrame"',
              'data-larynx-model="specimen"',
              'data-larynx-model="muscles"',
              'id="larynxModelCaption"',
              'id="mechanismObservationText"',
              'data-mode="pca"',
              'data-mode="lca"',
              'data-mode="ia"',
              'data-mode="ta"',
              'data-mode="ct"',
              "喉内肌的神经支配",
              "UBC Medicine",
              "University of Dundee",
          ]
          missing_larynx = [item for item in required_larynx_features if item not in larynx_page]
          if missing_larynx:
              raise SystemExit(f"Larynx mechanism page is missing expected model/interaction elements: {missing_larynx}")
          if 'id="mechMap"' in larynx_page or "AI 生成 · 非真实病例" in larynx_page:
              raise SystemExit("Unverified generated laryngoscopy mockups must not return to the anatomy lab")

          # Parse every inline script on both anatomy pages.
          import subprocess
          inline_total = 0
          for page_name, page_html in (("voice-anatomy", voice_page), ("larynx-mechanism", larynx_page)):
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', page_html, re.S | re.I)
              if not scripts:
                  raise SystemExit(f"{page_name} page has no inline interaction scripts")
              for number, script in enumerate(scripts):
                  script_path = Path(f"/tmp/{page_name}-inline-{number}.js")
                  script_path.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(script_path)], check=True)
              inline_total += len(scripts)

          print(f"Validated {inline_total} inline anatomy script(s) across both pages.")
          print(f"Tiles: {tile_titles}")
          print("Voice anatomy structure checks passed.")
          print("Page structure checks passed.")
          PY
