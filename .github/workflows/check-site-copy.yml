name: Check website copy changes

on:
  push:
    branches:
      - release/chinese-copy-update
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - "data/masterclasses.json"
      - "data/masterclass.schema.json"
      - "masterclasses.html"
      - "content_engine/**"
      - ".github/workflows/generate-social-drafts.yml"
      - ".github/workflows/check-site-copy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "data/conservatori_zh.json"
      - "data/conservatori_manual.json"
      - "data/masterclasses.json"
      - "data/masterclass.schema.json"
      - "masterclasses.html"
      - "content_engine/**"
      - ".github/workflows/generate-social-drafts.yml"
      - ".github/workflows/check-site-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check JSON data files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/conservatori_zh.json", "data/conservatori_manual.json", "data/masterclasses.json", "data/masterclass.schema.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          PY
      - name: Test social content generation
        run: |
          pip install CairoSVG
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m compileall -q content_engine
          python content_engine/generate.py
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("build/social-drafts")
          index = json.loads((out / "index.json").read_text(encoding="utf-8"))
          if not index["items"]:
              raise SystemExit("Expected at least one verified opportunity draft.")
          for item in index["items"]:
              image = out / item["image"]
              caption = out / item["markdown"]
              if not image.is_file() or image.stat().st_size < 1000:
                  raise SystemExit(f"Missing or empty PNG for {item['id']}")
              if not caption.is_file() or caption.stat().st_size < 100:
                  raise SystemExit(f"Missing or empty caption for {item['id']}")
          print(f"Generated and verified {len(index['items'])} social draft(s).")
          PY
      - name: Check page structure and data wiring
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")

          # The homepage keeps four interactive panels plus a standalone masterclass link.
          # Wording may change; the structure and the wiring must not.
          panels = ["open-calls", "conservatori", "music-library", "pdfs"]
          missing = [p for p in panels if f'id="{p}"' not in html]
          if missing:
              raise SystemExit(f"Missing panel sections: {missing}")

          if len(re.findall(r'<button class="tile"', html)) != 4:
              raise SystemExit("Expected exactly four entry tiles on the homepage")

          tile_titles = re.findall(r'<span class="tile-title">([^<]+)</span>', html)
          if len(tile_titles) != 5:
              raise SystemExit(f"Expected five homepage tile titles including masterclasses, found {len(tile_titles)}")
          if 'href="masterclasses.html"' not in html:
              raise SystemExit("Masterclasses entry link is missing")

          for panel in panels:
              if f'data-open="{panel}"' not in html:
                  raise SystemExit(f"No tile or nav entry points to panel {panel}")

          # Placeholder summaries may stay in the data, but must never reach the page.
          if "尚未人工翻译" in html:
              raise SystemExit("Placeholder summary text is rendered on the page")
          if "尚未人工翻译" not in app or "summaryOf" not in app:
              raise SystemExit("app.js lost the placeholder filter (summaryOf)")
          if "cleanName" not in app:
              raise SystemExit("app.js lost cleanName(); scraped field noise may leak into the UI")

          print(f"Tiles: {tile_titles}")
          print("Page structure checks passed.")
          PY
