<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12352e">
<meta name="description" content="Italia Audizioni 大师班与专业进修信息，收录经官方来源核验的声乐大师班、歌剧工作坊与课程。">
<link rel="stylesheet" href="styles.css?v=ux15">
<title>大师班与专业进修｜Italia Audizioni</title>
<style>
.master-wrap{max-width:1120px;margin:0 auto;padding:38px 24px 70px}
.master-back{display:inline-block;margin-bottom:28px;color:var(--brand-2);text-decoration:none}.master-wrap a{text-decoration:none}.master-wrap a:hover{text-decoration:none}
.master-head{padding:30px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(ellipse at 90% 10%,rgba(185,138,74,.16),transparent 42%),linear-gradient(135deg,rgba(18,53,46,.06),rgba(255,253,248,.86));margin-bottom:26px;box-shadow:var(--shadow)}
.master-head h1{font-size:clamp(30px,5vw,46px);margin-bottom:12px}
.master-head p{max-width:66ch;color:var(--ink-soft);font-size:14px}
.master-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.master-card{position:relative;overflow:hidden;background:var(--paper-2);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;min-height:100%}.master-card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--gold-soft),var(--brand-2))}.master-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.master-date{font-family:var(--serif);font-size:13px;color:var(--brand);background:rgba(18,53,46,.07);border:1px solid rgba(18,53,46,.12);border-radius:999px;padding:5px 10px}.master-source{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);padding-top:2px}.master-source-mark{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;font-family:var(--serif);font-size:11px;color:var(--gold);background:#fffdf8}
.master-tag{font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.master-card h2{font-size:21px;line-height:1.35}
.master-meta{font-size:13px;color:var(--ink-soft);line-height:1.8}
.master-actions{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:auto;font-size:13px}
.master-empty{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft);text-align:center}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="./"><span class="brand-mark">♫</span><span class="brand-text">Italia Audizioni<small>OPERA · AUDIZIONI · CONSERVATORI</small></span></a><nav class="nav"><a href="./">网站首页</a><a href="https://buttondown.com/wl19971007" target="_blank" rel="noopener">每周简报</a></nav></div></header>
<main class="master-wrap">
<a class="master-back" href="./">← 返回 Italia Audizioni</a>
<div class="master-head"><div class="eyebrow">Masterclasses · Corsi</div><h1>大师班与专业进修</h1><p>汇集声乐大师班、歌剧工作坊与专业进修课程。这里只展示已由主办机构官方来源核验并正式发布的信息。报名之前，请务必打开官方公告确认最新安排。</p></div>
<div id="masterList" class="master-list" aria-live="polite"><div class="master-empty">正在载入官方信息…</div></div>
</main>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"42879f330b824eb4843baa5bd13ba002"}'></script>
<script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=s=>{try{const u=new URL(String(s||""));return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}};
const fmt=s=>{if(!s)return "以官方公告为准";const d=new Date(s);return Number.isNaN(d.getTime())?"以官方公告为准":new Intl.DateTimeFormat("zh-CN",{timeZone:"Europe/Rome",dateStyle:"medium"}).format(d)};
async function init(){
 const root=document.getElementById("masterList");
 try{
  const r=await fetch("data/masterclasses.json",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.json(),today=Date.now();
  const items=(data.items||[]).filter(x=>x.publisher_status==="official"&&x.review_status==="verified"&&x.publication_status==="published"&&(!x.end_at||Date.parse(x.end_at)>=today)&&(!x.application_deadline_at||Date.parse(x.application_deadline_at)>=today)).sort((a,b)=>{const da=Date.parse(a.start_at),db=Date.parse(b.start_at);if(!Number.isFinite(da))return Number.isFinite(db)?1:0;if(!Number.isFinite(db))return -1;return da-db;});
  if(!items.length){root.innerHTML='<div class="master-empty">目前还没有通过官方核验并正式发布的大师班。我们会先核验信息，再更新这里。</div>';return;}
  root.innerHTML=items.map(x=>{
   const dateLabel=x.date_label_zh||fmt(x.start_at)+(x.end_at?" — "+fmt(x.end_at):"");
   const initials=String(x.source_name||"OL").split(/\s+/).filter(Boolean).slice(0,2).map(v=>v[0]).join("").toUpperCase();
   const facts=[x.teacher?"导师："+x.teacher:"",x.instrument_or_voice?"专业："+x.instrument_or_voice:"","地点："+(x.location||"以官方公告为准"),"费用："+(x.fee_eur==null?"以官方公告为准":x.fee_eur===0?"免费":"€"+x.fee_eur),x.language?"授课语言："+x.language:"",x.description_zh||""].filter(Boolean);
   const source=safeUrl(x.source_url),apply=safeUrl(x.application_url);
   return '<article class="master-card"><div class="master-card-top"><div class="master-tag">MASTERCLASS · OFFICIAL SOURCE</div><span class="master-date">'+esc(dateLabel)+'</span></div><h2>'+esc(x.title)+'</h2><div class="master-meta">'+facts.map(esc).join("<br>")+'</div><div class="master-source"><span class="master-source-mark">'+esc(initials)+'</span><span>信息发布方：'+esc(x.source_name)+'</span></div><div class="master-meta">最近核验：'+esc(x.last_verified_at||x.checked_at||"未记录")+'</div><div class="master-actions">'+(source?'<a href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">官方公告 ↗</a>':'')+(apply?'<a href="'+esc(apply)+'" target="_blank" rel="noopener noreferrer">报名 / 详情 ↗</a>':'')+'</div></article>'
  }).join("");
 }catch(e){root.innerHTML='<div class="master-empty">暂时无法载入大师班资料，请稍后重试。</div>';}
}
init();
</script>
</body></html>
