<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c35">
  <meta name="description" content="意大利歌剧、声乐比赛与试唱机会。公告来自主办方公开网页。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>声乐机会 · Italia</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="声乐机会首页"><span class="brand-mark">♫</span><span>声乐机会 <small>ITALIA</small></span></a>
    <button id="installButton" class="install-button" hidden>添加到主屏幕</button>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">OPERA · AUDIZIONI · CONCORSI</div>
      <h1>找到下一次登台机会。</h1>
      <p>意大利歌剧、声乐比赛与试唱信息，直接链接主办方公告。</p>
      <div class="hero-meta"><span class="live-dot"></span><span id="updatedAt">正在读取最新来源…</span><button id="refreshButton" class="text-button">立即更新</button></div>
    </section>

    <section class="section-head">
      <div><div class="eyebrow">OPEN CALLS</div><h2>报名中的机会</h2></div>
      <span id="opportunityCount" class="count-pill">—</span>
    </section>
    <div id="opportunities" class="opportunity-list" aria-live="polite"></div>

    <section class="notice" id="freshnessNotice">
      <span class="notice-icon">i</span>
      <p>每日从公开官网读取公告。网页抓取不能保证完整；报名资格和截止时间请以主办方原文为准。页面文字识别不确定的公告会保留在来源动态中，不会自动标成“仍开放”。</p>
    </section>

    <section class="section-head sources-head">
      <div><div class="eyebrow">OFFICIAL SOURCES</div><h2>来源动态</h2></div>
      <span id="sourceCount" class="count-pill">—</span>
    </section>
    <div class="filters">
      <label class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索机构或公告文字" autocomplete="off"></label>
      <select id="statusFilter" aria-label="筛选抓取状态"><option value="all">全部来源</option><option value="ok">读取成功</option><option value="error">读取异常</option></select>
    </div>
    <div id="sources" class="source-list" aria-live="polite"></div>
    <footer><span>声乐机会 · Italia</span><span>数据取自各主办方公开页面</span></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
