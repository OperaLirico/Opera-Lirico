name = "opera-lirico-ops"
main = "worker.js"
compatibility_date = "2026-11-10"
workers_dev = true

[vars]
# GraphQL siteTag is the Web Analytics site id, not the beacon token in the JS snippet.
# Using the beacon token here returns zero rows even though the dashboard shows traffic.
CF_WEB_ANALYTICS_SITE_TAG = "e6657aea01794d4295506abb40a09e99"
CF_WEB_ANALYTICS_HOST = "operalirico.github.io"
NEWSLETTER_MAX_RECIPIENTS = "250"
# Redeploy so the rotated CF_ANALYTICS_API_TOKEN secret reaches the Worker.
